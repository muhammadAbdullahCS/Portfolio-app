<section class="hero">
  <canvas #canvas class="webgl" aria-hidden="true"></canvas>

  <div class="hero__overlay">
    <div class="hero__inner">
      <p class="eyebrow">Premium developer portfolio</p>
      <h1 class="title">{{ content.homeTitle }}</h1>
      <p class="subtitle">{{ content.homeSubtitle }}</p>
      <p class="tagline">{{ content.homeTagline }}</p>
      <div class="actions">
        <a routerLink="/projects" class="btn primary">View projects</a>
        <a routerLink="/contact" class="btn ghost">Get in touch</a>
      </div>
    </div>
  </div>
</section>
