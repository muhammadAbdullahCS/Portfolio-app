<div class="dash">
  <header class="top">
    <div>
      <h1>Dashboard</h1>
      <p class="muted">Manage projects, site copy, and review contact submissions.</p>
    </div>
    <button type="button" class="logout" (click)="logout()">Logout</button>
  </header>

  <section class="panel">
    <h2>Site content</h2>
    <form [formGroup]="contentForm" (ngSubmit)="saveContent()" class="grid-form">
      <label>
        <span>Home title</span>
        <input type="text" formControlName="homeTitle" />
      </label>
      <label>
        <span>Home subtitle</span>
        <input type="text" formControlName="homeSubtitle" />
      </label>
      <label class="wide">
        <span>Home tagline</span>
        <input type="text" formControlName="homeTagline" />
      </label>
      <label>
        <span>About title</span>
        <input type="text" formControlName="aboutTitle" />
      </label>
      <label class="wide">
        <span>About bio</span>
        <textarea rows="4" formControlName="aboutBio"></textarea>
      </label>
      <label class="wide">
        <span>Skills (comma-separated)</span>
        <input type="text" formControlName="skillsText" />
      </label>
      <button class="primary" type="submit">Save content</button>
    </form>
  </section>

  <section class="panel">
    <h2>Projects</h2>

    <form [formGroup]="projectForm" (ngSubmit)="addProject()" class="add-form">
      <label>
        <span>Title</span>
        <input type="text" formControlName="title" />
      </label>
      <label class="wide">
        <span>Description</span>
        <input type="text" formControlName="description" />
      </label>
      <label class="wide">
        <span>Image URL</span>
        <input type="url" formControlName="image" placeholder="https://…" />
      </label>
      <button class="primary" type="submit">Add project</button>
    </form>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of projects">
            <td>{{ p.id }}</td>
            <td>{{ p.title }}</td>
            <td class="actions">
              <button type="button" class="link" (click)="startEdit(p)">Edit</button>
              <button type="button" class="link danger" (click)="deleteProject(p.id)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="edit" *ngIf="editing as e">
      <h3>Edit project #{{ e.id }}</h3>
      <label>
        <span>Title</span>
        <input type="text" [(ngModel)]="e.title" [ngModelOptions]="{ standalone: true }" />
      </label>
      <label class="wide">
        <span>Description</span>
        <textarea rows="3" [(ngModel)]="e.description" [ngModelOptions]="{ standalone: true }"></textarea>
      </label>
      <label class="wide">
        <span>Image URL</span>
        <input type="url" [(ngModel)]="e.image" [ngModelOptions]="{ standalone: true }" />
      </label>
      <div class="row">
        <button type="button" class="primary" (click)="saveEdit()">Save</button>
        <button type="button" class="ghost" (click)="cancelEdit()">Cancel</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Contact inbox</h2>
    <p class="muted" *ngIf="messages.length === 0">No messages yet.</p>

    <div class="msg" *ngFor="let m of messages">
      <div class="msg__head">
        <strong>{{ m.name }}</strong>
        <span class="email">{{ m.email }}</span>
        <span class="time">{{ m.createdAt | date: 'medium' }}</span>
        <button type="button" class="link danger" (click)="deleteMessage(m.id)">Remove</button>
      </div>
      <p class="msg__body">{{ m.message }}</p>
    </div>
  </section>
</div>
